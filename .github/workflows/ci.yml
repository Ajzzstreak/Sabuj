name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the trailing comment).
# Bump them deliberately, e.g. with Dependabot (package-ecosystem: github-actions).

jobs:
  contract:
    name: Contract copies match shared/types.ts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/sync-types.sh --check

  server:
    name: Server (typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    name: App (tsc, web export)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web
        env:
          CI: "1"

  docker:
    name: Server image (build + smoke test, no push)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: false
          load: true
          tags: deallens-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health check, graceful stop)
        run: |
          docker run -d --name dl -p 8787:8787 -e CORS_ORIGIN=http://localhost:8081 deallens-server:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8787/v1/health && break; sleep 1; done
          curl -sf http://localhost:8787/v1/health
          docker stop dl
          docker logs dl 2>&1 | grep -q '"msg":"closed"'
